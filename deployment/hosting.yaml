AWSTemplateFormatVersion: '2010-09-09'
Description: Amplify Hosting, Cognito sessions and GitHub OIDC deployment for WattByte Nexus.
Parameters:
  ApiRoleName:
    Type: String
    MinLength: 1
    Description: Existing independent API task role receiving account-management permissions.
  TransactionalEmailSender:
    Type: String
    AllowedPattern: '^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$'
  TransactionalEmailIdentityArn:
    Type: String
    AllowedPattern: '^arn:aws:ses:[a-z0-9-]+:[0-9]{12}:identity/.+$'
    Description: Verified SES identity; its region must match the API email_region setting.
  ApiOrigin:
    Type: String
    Default: ''
    AllowedPattern: '(^$|https://[a-z0-9.-]+)'
  DevelopApiOrigin:
    Type: String
    Default: https://api.nexus.ipss.ai
    AllowedPattern: 'https://[a-z0-9.-]+'
    Description: API origin for develop; currently shares production, independently switchable later.
  PublicOrigin:
    Type: String
    Default: ''
    AllowedPattern: '(^$|https://[a-z0-9.-]+)'
  DevelopPublicOrigin:
    Type: String
    Default: https://develop.digital-twin.wattbyte-nexus.com
    AllowedPattern: 'https://[a-z0-9.-]+'
Conditions:
  CustomOrigin: !Not [!Equals [!Ref PublicOrigin, '']]
  ApiConfigured: !Not [!Equals [!Ref ApiOrigin, '']]
Resources:
  App:
    Type: AWS::Amplify::App
    Properties:
      Name: wattbyte-nexus
      Platform: WEB
      CustomRules:
        - !If
          - ApiConfigured
          - Source: /api/<*>
            Target: !Sub ${ApiOrigin}/api/<*>
            Status: '200'
          - !Ref AWS::NoValue
        # Region identifiers can contain periods; static files live outside this route.
        - Source: '</^\/[Rr][Ee][Gg][Ii][Oo][Nn][Ss]\/.*$/>'
          Target: /index.html
          Status: '200'
        # Other SPA routes are extensionless. Serve files of every type directly.
        - Source: '</^[^.]+$/>'
          Target: /index.html
          Status: '200'
      CustomHeaders: |
        customHeaders:
          - pattern: '**'
            headers:
              - key: X-Content-Type-Options
                value: nosniff
              - key: Referrer-Policy
                value: strict-origin-when-cross-origin
              - key: X-Frame-Options
                value: SAMEORIGIN
          - pattern: '/api/**'
            headers:
              - key: Cache-Control
                value: private, no-store
          - pattern: '/index.html'
            headers:
              - key: Cache-Control
                value: no-cache
          - pattern: '/sw.js'
            headers:
              - key: Cache-Control
                value: no-cache
  Main:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt App.AppId
      BranchName: main
      Stage: PRODUCTION
      EnableAutoBuild: false
  Develop:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt DevelopApp.AppId
      BranchName: develop
      Stage: DEVELOPMENT
      EnableAutoBuild: false
  DevelopApp:
    Type: AWS::Amplify::App
    Properties:
      Name: wattbyte-nexus-development
      Platform: WEB
      CustomRules:
        - Source: /api/<*>
          Target: !Sub ${DevelopApiOrigin}/api/<*>
          Status: '200'
        - Source: '</^\/[Rr][Ee][Gg][Ii][Oo][Nn][Ss]\/.*$/>'
          Target: /index.html
          Status: '200'
        - Source: '</^[^.]+$/>'
          Target: /index.html
          Status: '200'
      CustomHeaders: |
        customHeaders:
          - pattern: '**'
            headers:
              - key: X-Content-Type-Options
                value: nosniff
              - key: Referrer-Policy
                value: strict-origin-when-cross-origin
              - key: X-Frame-Options
                value: SAMEORIGIN
          - pattern: '/api/**'
            headers:
              - key: Cache-Control
                value: private, no-store
          - pattern: '/index.html'
            headers:
              - key: Cache-Control
                value: no-cache
          - pattern: '/sw.js'
            headers:
              - key: Cache-Control
                value: no-cache
  PublicDomain:
    Type: AWS::Amplify::Domain
    Condition: CustomOrigin
    Properties:
      AppId: !GetAtt App.AppId
      DomainName: !Select [2, !Split ['/', !Ref PublicOrigin]]
      EnableAutoSubDomain: false
      SubDomainSettings:
        - Prefix: ''
          BranchName: !GetAtt Main.BranchName
  DevelopPublicDomain:
    Type: AWS::Amplify::Domain
    Properties:
      AppId: !GetAtt DevelopApp.AppId
      DomainName: !Select [2, !Split ['/', !Ref DevelopPublicOrigin]]
      EnableAutoSubDomain: false
      SubDomainSettings:
        - Prefix: ''
          BranchName: !GetAtt Develop.BranchName
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: wattbyte-nexus
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Schema:
        - Name: nexus_account_id
          AttributeDataType: String
          Mutable: false
          Required: false
          StringAttributeConstraints:
            MinLength: '1'
            MaxLength: '100'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub wattbyte-nexus-${AWS::AccountId}
      UserPoolId: !Ref UserPool
  Client:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: nexus-hosted-session
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !If
          - CustomOrigin
          - !Sub ${PublicOrigin}/api/digital-twin/callback
          - !Sub https://main.${App.DefaultDomain}/api/digital-twin/callback
        - !Sub https://develop.${DevelopApp.DefaultDomain}/api/digital-twin/callback
      LogoutURLs:
        - !If [CustomOrigin, !Sub '${PublicOrigin}/', !Sub 'https://main.${App.DefaultDomain}/']
        - !Sub https://develop.${DevelopApp.DefaultDomain}/
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: digital-twin/frontend/session-signing-key
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
  AccountManagementPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: nexus-account-management
      Roles: [!Ref ApiRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cognito-idp:DescribeUserPoolClient
              - cognito-idp:GetUserPoolMfaConfig
              - cognito-idp:AdminGetUser
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminSetUserPassword
              - cognito-idp:AdminUpdateUserAttributes
            Resource: !GetAtt UserPool.Arn
          - Effect: Allow
            Action: ses:SendEmail
            Resource: !Ref TransactionalEmailIdentityArn
            Condition:
              StringEquals:
                ses:FromAddress: !Ref TransactionalEmailSender
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: digital-twin-frontend-github-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:WattByte-Nexus/Digital-Twin-Frontend:environment:production
      Policies:
        - PolicyName: deploy-main-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [amplify:CreateDeployment, amplify:StartDeployment]
                Resource:
                  - !Sub ${App.Arn}/branches/main
                  - !Sub ${App.Arn}/branches/main/deployments/*
              - Effect: Allow
                Action: [amplify:GetJob, amplify:StopJob]
                Resource: !Sub ${App.Arn}/branches/main/jobs/*
  DevelopDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: digital-twin-frontend-develop-github-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:WattByte-Nexus/Digital-Twin-Frontend:environment:development
      Policies:
        - PolicyName: deploy-develop-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [amplify:CreateDeployment, amplify:StartDeployment]
                Resource:
                  - !Sub ${DevelopApp.Arn}/branches/develop
                  - !Sub ${DevelopApp.Arn}/branches/develop/deployments/*
              - Effect: Allow
                Action: [amplify:GetJob, amplify:StopJob]
                Resource: !Sub ${DevelopApp.Arn}/branches/develop/jobs/*
Outputs:
  AppId:
    Value: !GetAtt App.AppId
  FrontendUrl:
    Value: !If [CustomOrigin, !Ref PublicOrigin, !Sub 'https://main.${App.DefaultDomain}']
  AmplifyUrl:
    Value: !Sub https://main.${App.DefaultDomain}
  DevelopAppId:
    Value: !GetAtt DevelopApp.AppId
  DevelopFrontendUrl:
    Value: !Sub https://develop.${DevelopApp.DefaultDomain}
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  DevelopDeployRoleArn:
    Value: !GetAtt DevelopDeployRole.Arn
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref Client
  CognitoDomain:
    Value: !Sub https://${Domain}.auth.${AWS::Region}.amazoncognito.com
  SessionSecretArn:
    Value: !Ref SessionSecret
