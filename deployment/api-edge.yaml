AWSTemplateFormatVersion: '2010-09-09'
Description: HTTPS API edge owned by the frontend for the independent Fargate API.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  EngineSubnetId:
    Type: AWS::EC2::Subnet::Id
  PublicRouteTableId:
    Type: String
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  ApiDomain:
    Type: String
    Default: api.nexus.ipss.ai
  EnableApi:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  FargateTargetGroupArn:
    Type: String
    Description: Terraform-owned current API IP target group.
    AllowedPattern: '^arn:aws:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:targetgroup/.+$'
  FargateSecurityGroupId:
    Type: String
    Description: Terraform-owned API task security group; CloudFormation owns ALB egress to it.
    AllowedPattern: '^sg-([0-9a-f]{8}|[0-9a-f]{17})$'
Conditions:
  ApiEnabled: !Equals [!Ref EnableApi, 'true']
Resources:
  SecondSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.82.2.0/24
      Tags:
        - Key: Name
          Value: digital-twin-frontend-alb
  RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SecondSubnet
      RouteTableId: !Ref PublicRouteTableId
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: digital-twin-frontend-api-alb
      GroupDescription: HTTPS from Amplify/CloudFront; private forwarding to the Engine
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      # The existing FargateEgress resource owns the only outbound rule.
      SecurityGroupEgress: []
  # This stack remains the sole owner of every ALB security-group egress rule.
  FargateEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      DestinationSecurityGroupId: !Ref FargateSecurityGroupId
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ApiDomain
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ApiDomain
          HostedZoneId: !Ref HostedZoneId
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: RouteAssociation
    Properties:
      Name: digital-twin-frontend-api
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref SecurityGroup]
      Subnets: [!Ref EngineSubnetId, !Ref SecondSubnet]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '120'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - !If
          - ApiEnabled
          - Type: forward
            TargetGroupArn: !Ref FargateTargetGroupArn
          - Type: fixed-response
            FixedResponseConfig:
              StatusCode: '503'
              ContentType: text/plain
              MessageBody: Authenticated API deployment is being configured.
  Dns:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
Outputs:
  ApiOrigin:
    Value: !Sub https://${ApiDomain}
  SecurityGroupId:
    Value: !Ref SecurityGroup
  TargetGroupArn:
    Value: !Ref FargateTargetGroupArn
  LoadBalancerArn:
    Value: !Ref LoadBalancer
