AWSTemplateFormatVersion: '2010-09-09'
Description: HTTPS API edge owned by the frontend for the independent Fargate API.
Parameters:
  Environment:
    Type: String
    AllowedValues: [golden]
  ExpectedAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
  SecondSubnetCidr:
    Type: String
    Description: Nonoverlapping public subnet CIDR in the selected VPC; Golden currently uses 10.82.2.0/24.
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
  VpcId:
    Type: AWS::EC2::VPC::Id
  EngineSubnetId:
    Type: AWS::EC2::Subnet::Id
  PublicRouteTableId:
    Type: String
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  ApiDomain:
    Type: String
    AllowedPattern: '^[a-z0-9.-]+$'
  EnableApi:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  FargateTargetGroupArn:
    Type: String
    Default: ''
    Description: Terraform-owned current API IP target group; empty only while bootstrapping the edge.
    AllowedPattern: '^$|^arn:aws:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:targetgroup/.+$'
  FargateSecurityGroupId:
    Type: String
    Default: ''
    Description: Terraform-owned API task security group; CloudFormation owns ALB egress to it.
    AllowedPattern: '^$|^sg-([0-9a-f]{8}|[0-9a-f]{17})$'
Rules:
  AccountMatches:
    Assertions:
      - Assert: !Equals [!Ref ExpectedAccountId, !Ref 'AWS::AccountId']
        AssertDescription: Deploy using the explicitly selected AWS account.
  FargateInputsTogether:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref FargateTargetGroupArn, '']
            - !Equals [!Ref FargateSecurityGroupId, '']
          - !And
            - !Not [!Equals [!Ref FargateTargetGroupArn, '']]
            - !Not [!Equals [!Ref FargateSecurityGroupId, '']]
        AssertDescription: Supply both Fargate target group and task security group together.
  EnabledApiRequiresTarget:
    RuleCondition: !Equals [!Ref EnableApi, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref FargateTargetGroupArn, '']]
        AssertDescription: Supply the Fargate target group and task security group before enabling the API.
Conditions:
  FargatePrepared: !Not [!Equals [!Ref FargateTargetGroupArn, '']]
  ApiEnabled: !Equals [!Ref EnableApi, 'true']
Resources:
  SecondSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref SecondSubnetCidr
      Tags:
        - Key: Name
          Value: digital-twin-frontend-alb
  RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SecondSubnet
      RouteTableId: !Ref PublicRouteTableId
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: digital-twin-frontend-api-alb
      GroupDescription: HTTPS from Amplify/CloudFront; private forwarding to the Engine
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      # Preserve the live empty inline list once prepared. The bootstrap-only sink
      # suppresses AWS's default allow-all egress on a newly created security group.
      SecurityGroupEgress: !If
        - FargatePrepared
        - []
        - - IpProtocol: '-1'
            CidrIp: 255.255.255.255/32
  # This stack remains the sole owner of every ALB security-group egress rule.
  FargateEgress:
    # W1030 cannot infer nonempty paired parameters from the CloudFormation Rules.
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Type: AWS::EC2::SecurityGroupEgress
    Condition: FargatePrepared
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      DestinationSecurityGroupId: !Ref FargateSecurityGroupId
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ApiDomain
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ApiDomain
          HostedZoneId: !Ref HostedZoneId
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: RouteAssociation
    Properties:
      Name: digital-twin-frontend-api
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref SecurityGroup]
      Subnets: [!Ref EngineSubnetId, !Ref SecondSubnet]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '120'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - !If
          - ApiEnabled
          - Type: forward
            TargetGroupArn: !Ref FargateTargetGroupArn
          - Type: fixed-response
            FixedResponseConfig:
              StatusCode: '503'
              ContentType: text/plain
              MessageBody: Authenticated API deployment is being configured.
  Dns:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
Outputs:
  ApiOrigin:
    Value: !Sub https://${ApiDomain}
  SecurityGroupId:
    Value: !Ref SecurityGroup
  TargetGroupArn:
    Condition: FargatePrepared
    Value: !Ref FargateTargetGroupArn
  LoadBalancerArn:
    Value: !Ref LoadBalancer
  DeploymentEnvironment:
    Value: !Ref Environment
  DeploymentAccountId:
    Value: !Ref 'AWS::AccountId'
  DeploymentRegion:
    Value: !Ref 'AWS::Region'
  ListenerArn:
    Value: !Ref Listener
  SecondSubnetId:
    Value: !Ref SecondSubnet
