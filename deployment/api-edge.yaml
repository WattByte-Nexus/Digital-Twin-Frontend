AWSTemplateFormatVersion: '2010-09-09'
Description: HTTPS API edge owned by the frontend; supports independently verified Fargate targets.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  EngineInstanceId:
    Type: AWS::EC2::Instance::Id
  EngineSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  EngineSubnetId:
    Type: AWS::EC2::Subnet::Id
  PublicRouteTableId:
    Type: String
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  ApiDomain:
    Type: String
    Default: api.nexus.ipss.ai
  EnableApi:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  FargateTargetGroupArn:
    Type: String
    Default: ''
    Description: Terraform-owned IP target group; set during preparation without switching ordinary traffic.
    AllowedPattern: '^$|^arn:aws:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:targetgroup/.+$'
  FargateSecurityGroupId:
    Type: String
    Default: ''
    Description: Terraform-owned API task security group; CloudFormation owns ALB egress to it.
    AllowedPattern: '^$|^sg-([0-9a-f]{8}|[0-9a-f]{17})$'
  UseFargateApi:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Switch ordinary authenticated API requests only after independent acceptance checks pass.
Rules:
  FargateInputsTogether:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref FargateTargetGroupArn, '']
            - !Equals [!Ref FargateSecurityGroupId, '']
          - !And
            - !Not [!Equals [!Ref FargateTargetGroupArn, '']]
            - !Not [!Equals [!Ref FargateSecurityGroupId, '']]
        AssertDescription: Supply both Fargate target group and task security group together.
  FargateSwitchRequiresTarget:
    RuleCondition: !Equals [!Ref UseFargateApi, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref FargateTargetGroupArn, '']]
        AssertDescription: Prepare Fargate before switching ordinary traffic.
Conditions:
  FargatePrepared: !Not [!Equals [!Ref FargateTargetGroupArn, '']]
  FargateActive: !Equals [!Ref UseFargateApi, 'true']
  FargateVerification: !And
    - !Not [!Equals [!Ref FargateTargetGroupArn, '']]
    - !Equals [!Ref UseFargateApi, 'false']
    - !Equals [!Ref EnableApi, 'true']
  ApiEnabled: !Equals [!Ref EnableApi, 'true']
Resources:
  SecondSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.82.2.0/24
      Tags:
        - Key: Name
          Value: digital-twin-frontend-alb
  RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SecondSubnet
      RouteTableId: !Ref PublicRouteTableId
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: digital-twin-frontend-api-alb
      GroupDescription: HTTPS from Amplify/CloudFront; private forwarding to the Engine
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          DestinationSecurityGroupId: !Ref EngineSecurityGroupId
  # This stack remains the sole owner of every ALB security-group egress rule.
  FargateEgress:
    # W1030 cannot infer nonempty paired parameters from the CloudFormation Rules.
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Type: AWS::EC2::SecurityGroupEgress
    Condition: FargatePrepared
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      DestinationSecurityGroupId: !Ref FargateSecurityGroupId
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ApiDomain
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ApiDomain
          HostedZoneId: !Ref HostedZoneId
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: RouteAssociation
    Properties:
      Name: digital-twin-frontend-api
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref SecurityGroup]
      Subnets: [!Ref EngineSubnetId, !Ref SecondSubnet]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '120'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: digital-twin-frontend-api
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: instance
      Targets:
        - Id: !Ref EngineInstanceId
      HealthCheckPath: /api/v1/health/ready
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: '200'
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - !If
          - ApiEnabled
          - Type: forward
            TargetGroupArn: !If [FargateActive, !Ref FargateTargetGroupArn, !Ref TargetGroup]
          - Type: fixed-response
            FixedResponseConfig:
              StatusCode: '503'
              ContentType: text/plain
              MessageBody: Authenticated API deployment is being configured.
  # Association permits ECS startup before cutover. This opt-in diagnostic route
  # uses the same API authentication and disappears when normal traffic switches.
  FargateVerificationRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: FargateVerification
    Properties:
      ListenerArn: !Ref Listener
      Priority: 49000
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Digital-Twin-Api-Target
            Values: [fargate]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref FargateTargetGroupArn
  Dns:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
Outputs:
  ApiOrigin:
    Value: !Sub https://${ApiDomain}
  SecurityGroupId:
    Value: !Ref SecurityGroup
  TargetGroupArn:
    Value: !Ref TargetGroup
  FargateTargetGroupArn:
    Condition: FargatePrepared
    Value: !Ref FargateTargetGroupArn
  LoadBalancerArn:
    Value: !Ref LoadBalancer
